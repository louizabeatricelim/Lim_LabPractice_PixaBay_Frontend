<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixabay Challenge Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=10" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1 class="brand">Pixabay Challenge Viewer</h1>
        <p class="tagline">
          Search Pixabay for photos or videos, or run one of the four fixed lab
          challenges.
        </p>
      </header>

      <form class="search-row" id="search-form" autocomplete="off">
        <label class="sr-only" for="search-term">Search term</label>
        <input
          type="search"
          id="search-term"
          name="q"
          placeholder="Enter a search term…"
          maxlength="100"
          required
        />

        <label class="field-label" for="media-type">Type</label>
        <select id="media-type" name="mediaType" aria-label="Photo or Video">
          <option value="photo">Photo</option>
          <option value="video">Video</option>
        </select>

        <label class="field-label" for="view-mode">View</label>
        <select id="view-mode" name="viewMode" aria-label="Result view">
          <option value="spotlight">Spotlight</option>
          <option value="pair">Pair</option>
          <option value="gallery" selected>Gallery</option>
          <option value="quad">Quad</option>
          <option value="mosaic">Mosaic</option>
          <option value="filmstrip">Filmstrip</option>
        </select>

        <button type="submit" class="btn btn-primary">Search</button>
      </form>

      <section class="challenges" aria-label="Lab challenges">
        <button type="button" class="btn btn-challenge" data-challenge="rocket">
          Rocket Launch
          <span class="challenge-type">Video</span>
        </button>
        <button
          type="button"
          class="btn btn-challenge"
          data-challenge="basketball"
        >
          Basketball
          <span class="challenge-type">Video</span>
        </button>
        <button type="button" class="btn btn-challenge" data-challenge="forest">
          Forest
          <span class="challenge-type">Video</span>
        </button>
        <button
          type="button"
          class="btn btn-challenge"
          data-challenge="roadForest"
        >
          Road Forest
          <span class="challenge-type">Photo</span>
        </button>
      </section>

      <p class="status" id="status" role="status" aria-live="polite"></p>

      <section class="results" id="results" data-view="gallery" aria-label="Search results"></section>

      <p class="attribution">
        Images and videos from
        <a href="https://pixabay.com/" target="_blank" rel="noopener noreferrer"
          >Pixabay</a
        >.
      </p>
    </main>

    <script src="config.js?v=10"></script>
    <script src="app.js?v=10"></script>
  </body>
</html>
